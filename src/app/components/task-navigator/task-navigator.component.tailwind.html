<div
  class="w-full max-w-[600px] mx-auto rounded-md box-border flex flex-col gap-6"
  style="min-width: min(100vw - 2rem, 600px)"
  >
  <!-- Task Navigator Section -->
  <div class="p-4">
    <div class="pb-3">
      <app-task-card [task]="selectedOverlord" [ifShowExtra]="true"></app-task-card>
    </div>

    <div *ngIf="!tasks?.length" class="text-center py-8 text-gray-500 dark:text-gray-400">
      <app-task-edit
        *ngIf="selectedOverlord"
        [task]="selectedOverlord!"
        [isPopup]="false"
      ></app-task-edit>
      <p class="mt-4">No other tasks yet.</p>
    </div>

    <app-task-list-item
      *ngFor="let task of tasks; trackBy: trackByTaskId"
      [task]="task"
      (navigate)="onNext($event)"
    ></app-task-list-item>
  </div>
