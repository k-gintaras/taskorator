<div class="w-full max-w-[600px] mx-auto p-4 rounded-md box-border" style="min-width: min(100vw - 2rem, 600px)">
  <!-- No Tasks Message -->
  @if (tasks.length === 0) {
    <div class="flex items-center justify-center py-12 text-center overflow-visible">
      <div class="flex flex-col items-center gap-3">
        <mat-icon class="text-5xl opacity-40 theme-text-secondary leading-none inline-block align-middle">task_alt</mat-icon>
        <p class="text-base font-medium theme-text-secondary">No tasks in this list</p>
      </div>
    </div>
  }

  <!-- Task List -->
  @if (tasks.length > 0) {
    <div class="space-y-2">
      @for (task of tasks; track task) {
        <div class="bg-base-200/50 rounded-lg border border-base-300/50 p-3">
          <div class="flex items-center justify-between gap-3">
            <!-- Task Content -->
            <div class="flex-1 min-w-0">
              <app-task-mini [task]="task" [disableClick]="true"></app-task-mini>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center gap-2 flex-shrink-0">
              <button
                class="theme-nav-item w-9 h-9 rounded-lg flex items-center justify-center"
                (click)="editTask(task)"
                aria-label="Edit task"
                matTooltip="Edit task"
                >
                <mat-icon>edit</mat-icon>
              </button>
              <button
                class="theme-nav-item w-9 h-9 rounded-lg flex items-center justify-center hover:!bg-red-500/10 hover:!text-red-500"
                (click)="deleteTask(task)"
                aria-label="Delete task"
                matTooltip="Delete task"
                >
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  }
</div>
