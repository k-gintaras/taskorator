<div class="w-full max-w-full p-4 rounded-md box-border">
  <!-- No Tasks Message -->
  @if (tasks.length === 0) {
    <div class="text-center py-8 text-gray-500 dark:text-gray-400">
      <mat-icon class="text-5xl opacity-40 leading-none">task_alt</mat-icon>
      <p class="mt-4">No tasks in this list</p>
    </div>
  }

  <!-- Task List -->
  @if (tasks.length > 0) {
    @for (task of tasks; track task.taskId) {
      <div class="relative">
        <div
          class="theme-card flex items-center justify-between rounded-md p-3 mb-3 border box-border w-full max-w-full relative transition-shadow"
          style="border-left: 6px solid #7d4fbf"
        >
          <!-- Task Content -->
          <div class="flex-1 px-3 min-w-0 overflow-hidden relative">
            <app-task-mini [task]="task" [disableClick]="true"></app-task-mini>
          </div>

          <!-- Action Buttons -->
          <div class="flex items-center gap-2 flex-shrink-0">
            <button
              class="flex items-center justify-center rounded-md min-w-[2.5rem] min-h-[2.5rem] p-2 theme-bg-elevated"
              (click)="editTask(task)"
              aria-label="Edit task"
              matTooltip="Edit task"
              >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              class="flex items-center justify-center rounded-md min-w-[2.5rem] min-h-[2.5rem] p-2 theme-bg-elevated hover:!bg-red-500/10 hover:!text-red-500"
              (click)="deleteTask(task)"
              aria-label="Delete task"
              matTooltip="Delete task"
              >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
      </div>
    }
  }
</div>
