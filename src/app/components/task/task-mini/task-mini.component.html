<div class="task-mini-container" (click)="onTaskCardClick(task)">
  <p class="task-title theme-text-primary">{{ task?.name }}</p>
  <p *ngIf="overlordName" class="task-overlord theme-text-secondary">Overlord: {{ overlordName }}</p>
  <span *ngIf="(showPriority$ | async) && task?.priority" class="task-priority theme-text-secondary">
    Priority: {{ task?.priority }}
  </span>
</div>
