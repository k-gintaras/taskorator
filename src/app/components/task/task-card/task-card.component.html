@if (task) {
  <div
    class="card theme-card shadow-md max-w-xl mx-auto rounded-t-lg border-l flex flex-col"
    [ngClass]="{
    'min-h-[140px]': ifShowExtra,
    'min-h-[100px]': !ifShowExtra
  }"
    [style.borderLeftColor]="getAgeBasedBorderColor()"
    [style.borderLeftWidth]="'var(--task-age-border-width)'"
    [style.borderLeftStyle]="'solid'"
    >
    <div class="card-body p-4 flex flex-col flex-1">
      <!-- Breadcrumb Header -->
      <div class="mb-2">
        <app-task-breadcrumb></app-task-breadcrumb>
      </div>

      <!-- Main content - task description and why -->
      <div
        class="flex-1 space-y-1 text-sm theme-text-secondary"
        >
        @if (task.todo) {
          <div class="max-h-[40px] overflow-y-auto">
            <p class="leading-relaxed text-xs theme-text-secondary">{{ task.todo }}</p>
          </div>
        }
        @if (ifShowExtra && task.why) {
          <div class="max-h-[30px] overflow-y-auto">
            <p class="leading-relaxed text-xs theme-text-secondary">
              Why: {{ task.why }}
            </p>
          </div>
        }
      </div>

      <!-- Action Buttons -->
      <!-- DISABLED: Forge Tasks and Sentinel features require deployed AI API backend
      @if (ifShowExtra) {
        <div class="flex gap-2 mt-2 pt-2 border-t border-gray-100">
          <button
            mat-raised-button
            color="primary"
            (click)="onAiSuggestTasks()"
            matTooltip="Generate task suggestions using Dreamforge AI"
            class="flex-1 h-8 text-xs"
          >
            <mat-icon class="text-sm">sparkles</mat-icon>
            <span class="ml-1">Forge Tasks</span>
          </button>
          <button
            mat-raised-button
            disabled
            matTooltip="View all tasks from the tree (Coming soon)"
            class="flex-1 h-8 text-xs"
          >
            <mat-icon class="text-sm">visibility</mat-icon>
            <span class="ml-1">Sentinel</span>
          </button>
        </div>
      }
      -->
    </div>
  </div>
}
