<div class="px-3 py-2 select-none w-full max-w-full">
  <!-- Title at top -->
  @if (currentPath$ | async; as path) {
    @if (path.length) {
      <button
        class="text-xl font-semibold theme-text-primary text-left hover:underline max-w-full break-words mb-2"
        (click)="jumpTo(path[path.length - 1].id)"
        [title]="path[path.length - 1].name"
        >
        {{ path[path.length - 1].name }}
      </button>
    }
  }

  <div class="flex items-center flex-wrap gap-3 max-w-full">
    <button
      mat-icon-button
      color="primary"
      (click)="goBack()"
      aria-label="Go Back"
      >
      <mat-icon>arrow_back</mat-icon>
    </button>

    @if (currentPath$ | async; as path) {
      @if (path.length > 1) {
        <nav
          class="flex flex-wrap items-center gap-1 theme-text-secondary text-sm max-w-full"
          aria-label="Breadcrumb"
          >
          @for (crumb of path; track crumb; let last = $last) {
            <a
              class="cursor-pointer hover:underline break-words max-w-[120px] truncate"
              [title]="crumb.name"
              (click)="jumpTo(crumb.id)"
              >
              {{ crumb.name }}
            </a>
            @if (!last) {
              <span class="theme-text-muted mx-1 select-none">›</span>
            }
          }
        </nav>
      }
    }
  </div>
</div>
