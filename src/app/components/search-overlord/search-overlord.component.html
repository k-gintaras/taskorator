<mat-form-field appearance="fill">
  <mat-label>Select an Overlord Task</mat-label>
  <mat-select (selectionChange)="handleOverlordSelection($event.value)">
    <mat-option>
      <ngx-mat-select-search
        [formControl]="taskSearchCtrl"
        placeholderLabel="find task..."
        noEntriesFoundLabel="task not found"
      ></ngx-mat-select-search>
    </mat-option>
    @for (option of filteredTaskOptions | async; track option) {
      <mat-option
        [value]="option.taskId"
        >
        {{ option.name }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>
