<h2>Test Task Tagging</h2>
<div class="p-4 bg-white/80 dark:bg-gray-800 rounded-lg">
  <app-tag-multiple-items
    [items]="items"
    [tagGroups]="tagGroups"
    (tagAdded)="onTagAdded($event)"
    (tagRemoved)="onTagRemoved($event)">
  </app-tag-multiple-items>
</div>
