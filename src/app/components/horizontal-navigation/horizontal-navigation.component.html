<!-- Top Navigation Bar -->
<mat-toolbar class="theme-topbar nav-toolbar">
  <div class="nav-toolbar-left">
    <button 
      mat-icon-button 
      (click)="toggleDrawer()"
      class="theme-nav-item nav-menu-btn"
      aria-label="Toggle navigation menu"
    >
      <mat-icon>menu</mat-icon>
    </button>
  </div>
  
  <div class="nav-toolbar-center">
    <!-- Notification component replaces title - shows app name normally, notifications when active -->
    <app-notification class="nav-notification-topbar"></app-notification>
  </div>
  
  <div class="nav-toolbar-right">
    <app-search-create class="nav-search-create"></app-search-create>
  </div>
</mat-toolbar>

<!-- Main Layout Container -->
<mat-sidenav-container class="nav-container">
  <!-- Sidebar Navigation -->
  <mat-sidenav
    #drawer
    [mode]="isHandset ? 'over' : 'side'"
    [opened]="!isHandset && !isCompact"
    class="theme-sidebar nav-sidebar"
  >
    <div class="nav-sidebar-content">
      <!-- Navigation Items Container -->
      <div class="nav-items-container">
        <!-- Parent Items (Left Column) -->
        <div class="nav-column nav-parent-column">
          <ul class="nav-list">
            <li
              *ngFor="let item of parentItems"
              class="nav-item theme-nav-item"
              [class.active]="isSelected(item.path)"
              (click)="onParentClick(item)"
            >
              <div class="nav-item-content">
                <mat-icon class="nav-item-icon">{{ item.metadata.icon || "folder" }}</mat-icon>
                <span class="nav-item-text">{{ item.metadata.title }}</span>
              </div>
            </li>
          </ul>
        </div>

        <!-- Child Items (Right Column) -->
        <div class="nav-column nav-child-column">
          <ul class="nav-list">
            <li
              *ngFor="let child of childItems"
              class="nav-item theme-nav-item"
              [class.active]="isSelected(child.path)"
              (click)="onChildClick(child)"
            >
              <div class="nav-item-content">
                <span class="nav-item-text">
                  {{ child.metadata.altName || child.metadata.title }}
                </span>
              </div>
            </li>
          </ul>
        </div>
      </div>

      <!-- Bottom Actions Container -->
      <div class="nav-actions-container">
        <!-- Extra Controls Section -->
        <div class="nav-extra-actions">
          <h4 class="nav-section-title">View Controls</h4>
          <app-extra-actions></app-extra-actions>
        </div>
        <!-- Artificer Section -->
        <div class="nav-artificer-actions" *ngIf="showArtificer">
          <h4 class="nav-section-title">Task Actions</h4>
          <app-artificer></app-artificer>
        </div>
      </div>
    </div>
  </mat-sidenav>

  <!-- Main Content Area -->
  <mat-sidenav-content class="theme-content nav-main-content">
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
