<h2 mat-dialog-title class="dialog-title theme-text-primary">Mass Add</h2>
<!-- <mat-dialog-title>Edit Task</mat-dialog-title> -->
<mat-dialog-content>
  <app-input-to-tasks [overlord]="overlord"></app-input-to-tasks>
</mat-dialog-content>
<mat-dialog-actions>
  <button
    mat-icon-button
    class="theme-btn-primary w-10 h-10 rounded-lg flex items-center justify-center"
    (click)="onSave()"
    aria-label="Save Task"
  >
    <mat-icon>close</mat-icon>
  </button>
</mat-dialog-actions>
