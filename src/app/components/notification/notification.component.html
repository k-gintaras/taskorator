<div class="notification-container" (click)="toggleFeedbackView()">
  <!-- App title when no feedback -->
  @if (!feedbackUpdated) {
    <h1 class="app-title">
      {{ appTitle }}
    </h1>
  }

  <!-- Feedback message for larger screens -->
  @if (message && feedbackUpdated) {
    <div class="feedback-message">
      {{ message }}
    </div>
  }

  <!-- Blinker for smaller screens -->
  @if (feedbackUpdated) {
    <div class="blinker"></div>
  }
</div>
