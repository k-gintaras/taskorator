<div
  class="w-full h-full flex items-center justify-center"
  (click)="onClick()"
>
  <!-- Small screens: icon-only bubble -->
  <button
    class="theme-nav-item md:hidden w-9 h-9 rounded-full flex items-center justify-center transition-transform"
    [ngClass]="uiState.pulse ? 'notify-pulse' : ''"
    [style.background-color]="'color-mix(in srgb, ' + getColor(uiState.colorVar) + ' 12%, transparent)'"
    [style.border]="'1px solid ' + getColor(uiState.colorVar)"
  >
      <mat-icon
        class="text-base"
        [style.color]="getColor(uiState.textColorVar)"
      >
      {{ uiState.icon }}
    </mat-icon>
  </button>

  <!-- Larger screens: icon + label pill (but hide label for status) -->
  <button
    class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full theme-nav-item max-w-xs"
    [ngClass]="uiState.pulse ? 'notify-pulse' : ''"
    [style.background-color]="'color-mix(in srgb, ' + getColor(uiState.colorVar) + ' 12%, transparent)'"
    [style.border]="'1px solid ' + getColor(uiState.colorVar)"
  >
      <mat-icon
        class="text-sm shrink-0"
        [style.color]="getColor(uiState.textColorVar)"
      >
      {{ uiState.icon }}
    </mat-icon>

    <!-- Only show label for non-status states -->
    <span
      *ngIf="uiState.click !== 'status'"
      class="theme-text-secondary text-xs font-medium truncate"
      [style.color]="getColor(uiState.textColorVar)"
    >
      {{ uiState.label }}
    </span>
  </button>
</div>
