<div class="relative">
  <app-chunked-progress
    [treeNode]="getTreeNodeInfo()"
    class="absolute top-0 left-0 right-0 z-10"
  ></app-chunked-progress>

  <div
    [ngClass]="task.isSelected ? 'bg-secondary' : 'theme-card'"
    [ngStyle]="{ 'border-left': '6px solid ' + task.color }"
    class="flex items-center justify-between rounded-md p-3 mb-3 border box-border cursor-pointer w-full relative transition-shadow"
  >
    <!-- Navigate / Expand Button -->
    <button
      class="flex items-center justify-center rounded-md min-w-[2.5rem] min-h-[2.5rem] p-2"
      [ngClass]="{
        'theme-btn-primary': task.isRecentlyViewed,
        'theme-btn-secondary': !task.isRecentlyViewed && task.isRecentlyUpdated,
        'theme-btn-accent': !task.isRecentlyViewed && !task.isRecentlyUpdated && task.isRecentlyCreated,
        'theme-bg-elevated': !task.isRecentlyViewed && !task.isRecentlyUpdated && !task.isRecentlyCreated
      }"
      (click)="onNavigateClick($event)"
    >
      <mat-icon>arrow_forward</mat-icon>
    </button>

    <div class="flex-1 px-3 min-w-0 overflow-hidden relative">
      <app-task-mini [task]="task"></app-task-mini>
    </div>

    <app-artificer-action
      [treeNode]="getTreeNodeInfo()"
      [task]="task"
      class="flex-shrink-0"
    ></app-artificer-action>
  </div>
</div>
