<div class="extra-actions-container">
  <!-- Theme Toggle Button (Artificer Style) -->
  <button
    mat-icon-button
    (click)="toggleTheme()"
    class="extra-action-btn-compact"
    [attr.aria-label]="'Current theme: ' + extraActionsService.getCurrentTheme()"
    [title]="'Switch to ' + (extraActionsService.getCurrentTheme() === 'light' ? 'dark' : extraActionsService.getCurrentTheme() === 'dark' ? 'high contrast' : 'light') + ' theme'"
  >
    <mat-icon>
      {{ extraActionsService.getCurrentTheme() === 'light' ? 'light_mode' : extraActionsService.getCurrentTheme() === 'dark' ? 'dark_mode' : 'contrast' }}
    </mat-icon>
  </button>

  <!-- Compact Sort Controls -->
  <button
    mat-icon-button
    class="sort-btn-compact"
    [class.active]="currentSort === 'rules'"
    (click)="changeSort('rules')"
    [attr.aria-label]="'Sort by list rules'"
    [title]="'Sort tasks by list-specific rules (default)'"
  >
    <mat-icon>rule</mat-icon>
  </button>
  <button
    mat-icon-button
    class="sort-btn-compact"
    [class.active]="currentSort === 'date'"
    (click)="changeSort('date')"
    [attr.aria-label]="'Sort by date'"
    [title]="'Sort tasks by creation date'"
  >
    <mat-icon>schedule</mat-icon>
    <mat-icon *ngIf="currentSort==='date'" class="direction-icon">
      {{ sortDirection === 'asc' ? 'arrow_upward' : 'arrow_downward' }}
    </mat-icon>
  </button>
  <button
    mat-icon-button
    class="sort-btn-compact"
    [class.active]="currentSort === 'priority'"
    (click)="changeSort('priority')"
    [attr.aria-label]="'Sort by priority'"
    [title]="'Sort tasks by priority level'"
  >
    <mat-icon>flag</mat-icon>
    <mat-icon *ngIf="currentSort==='priority'" class="direction-icon">
      {{ sortDirection === 'asc' ? 'arrow_upward' : 'arrow_downward' }}
    </mat-icon>
  </button>

  <!-- Reset button removed: sorting defaults to rules when selected -->
</div>
