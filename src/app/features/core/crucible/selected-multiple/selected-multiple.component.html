<div class="theme-content p-4 md:p-6">
  <div class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body">
      <div class="mb-4">
        <h2 class="card-title theme-text-primary flex items-center gap-2 mb-2">
          <mat-icon>checklist</mat-icon>
          Selected Tasks
        </h2>
        <p class="text-sm theme-text-secondary mb-4">
          "Manage your selections" - View and manage your currently selected tasks
        </p>
      </div>
      <app-staged-task-list [tasks]="selectedTasks" (tasksChange)="updateSelectedTasks($event)">
      </app-staged-task-list>
    </div>
  </div>
</div>
