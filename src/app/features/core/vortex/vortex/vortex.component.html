<div class="theme-content p-4 md:p-6">
  <div class="mb-6">
    <div class="flex items-center gap-3 mb-3">
      <mat-icon class="text-primary flex-shrink-0" style="font-size: 2rem; width: 2rem; height: 2rem; display: flex; align-items: center; justify-content: center;">{{ data.icon }}</mat-icon>
      <h1 class="text-2xl font-bold theme-text-primary" style="margin: 0; display: flex; align-items: center;">{{ data.title }}</h1>
    </div>
    <p class="theme-text-secondary">{{ data.description }}</p>
  </div>

  <!-- Navigation Tabs -->
  <div class="mb-6">
    <nav class="flex space-x-1 bg-gray-100 dark:bg-gray-800 p-1 rounded-lg">
      <a
        routerLink="vizualizer"
        routerLinkActive="bg-white dark:bg-gray-700 text-primary shadow-sm"
        class="flex-1 flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200 text-gray-600 dark:text-gray-300 hover:text-primary"
        >
        <mat-icon class="mr-2 text-sm">account_tree</mat-icon>
        Tree View
      </a>
      <a
        routerLink="repair"
        routerLinkActive="bg-white dark:bg-gray-700 text-primary shadow-sm"
        class="flex-1 flex items-center justify-center px-4 py-2 text-sm font-medium rounded-md transition-colors duration-200 text-gray-600 dark:text-gray-300 hover:text-primary"
        >
        <mat-icon class="mr-2 text-sm">build</mat-icon>
        Tree Repair
      </a>
    </nav>
  </div>

  <router-outlet></router-outlet>
</div>
