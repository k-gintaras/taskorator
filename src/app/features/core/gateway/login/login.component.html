<!-- Login Container with Theme Integration -->
<div class="login-container theme-content">
  <!-- Login Card -->
  <div class="login-card theme-card">
    <div class="login-card-header">
      <h2 class="login-card-title theme-text-primary">Sign In</h2>
    </div>
    <div class="login-card-body">

      <!-- Main Login Section -->
      <div class="login-main-section">

        <!-- Warning Banner -->
        @if (showPopupWarning) {
          <div class="login-alert alert-warning">
            <button
              (click)="hideWarning()"
              class="login-alert-close"
              aria-label="Close warning"
              >
              ×
            </button>
            <div class="flex items-start">
              <div class="flex-shrink-0">
                <svg class="w-5 h-5 text-amber-500 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                  <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"></path>
                </svg>
              </div>
              <div class="ml-3">
                <p class="theme-text-secondary">{{ warningMessage }}</p>
              </div>
            </div>
          </div>
        }

        <!-- Primary Login Button -->
        <button
          (click)="loginOnline()"
          class="login-btn login-btn-primary"
          [disabled]="loading"
          >
          {{ loading && currentLoginMethod === 'popup' ? "Signing in..." : "Continue with Google" }}
        </button>

        <!-- Alternative Login Options -->
        @if (showAlternativeLogin) {
          <div class="login-alert alert-info">
            <button
              (click)="hideAlternativeLogin()"
              class="login-alert-close"
              aria-label="Close alternative login"
              >
              ×
            </button>
            <p class="theme-text-secondary">
              Enable popups or
              <button
                (click)="loginWithRedirect()"
                class="login-link"
                [disabled]="loading"
                >
                try redirect login
              </button>
            </p>
          </div>
        }

        <!-- Alternative Link -->
        <div class="text-center">
          <button
            (click)="loginWithRedirect()"
            class="login-link"
            [disabled]="loading"
            >
            {{ loading && currentLoginMethod === 'redirect' ? "redirecting..." : "Login without popup" }}
          </button>
        </div>
      </div>

      <!-- Offline Section -->
      <div class="login-offline-section">
        <button
          (click)="loginOffline()"
          class="login-btn login-btn-secondary"
          [disabled]="loading"
          >
          Try Offline Mode
        </button>
      </div>

      <!-- Footer Links -->
      <div class="login-footer">
        <button
          (click)="logout()"
          class="login-footer-link login-footer-debug"
          title="Clear session"
          >
          🧪 Reset
        </button>
      </div>
    </div>
  </div>

  <!-- External Footer -->
  <div class="login-external-footer">
    <p class="theme-text-muted">
      New to Taskorator?
      <button
        (click)="goToGateway()"
        class="login-link"
        >
        Explore features
      </button>
    </p>
  </div>
</div>
