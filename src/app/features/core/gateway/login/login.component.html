<div class="login-container theme-content">
  <div class="login-card theme-card">
    <div class="login-card-header">
      <h2 class="login-card-title theme-text-primary">Sign In</h2>
      <p class="theme-text-muted">Use your Google account to continue.</p>
    </div>

    <div class="login-card-body">
      @if (showWarningBanner) {
        <div class="login-alert alert-warning">
          <button (click)="hideWarning()" class="login-alert-close" aria-label="Close warning">×</button>
          <p class="theme-text-secondary">{{ warningMessage }}</p>
        </div>
      }

      @if (isAuthenticated) {
        <div class="login-alert alert-success">
          <p class="theme-text-secondary font-semibold">You are already signed in.</p>
          <div class="login-actions">
            <button class="login-btn login-btn-primary" (click)="continueToApp()">Continue</button>
            <button class="login-link" (click)="logout()">Log out</button>
          </div>
        </div>
      } @else {
        <div class="login-alert alert-info">
          <p class="theme-text-secondary font-semibold">Single sign-in flow</p>
          <p class="theme-text-muted text-sm mt-2">Popup first, redirect fallback if needed.</p>
        </div>

        <button class="login-btn login-btn-primary" (click)="loginOnline()" [disabled]="loading">
          {{ loading ? 'Signing in...' : 'Continue with Google' }}
        </button>

        <div class="text-center">
          <button class="login-link" (click)="loginWithRedirect()" [disabled]="loading">
            Use redirect instead
          </button>
        </div>
      }
    </div>
  </div>
</div>
