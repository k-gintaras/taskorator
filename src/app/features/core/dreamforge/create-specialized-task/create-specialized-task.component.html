<div class="theme-content p-6">
  <div class="theme-card p-6 max-w-md mx-auto">
    <h2 class="theme-text-primary text-xl font-semibold mb-6">Create Specialized Task</h2>

    <form #taskForm="ngForm" (ngSubmit)="saveTask()" class="space-y-4">
      <!-- Task Name -->
      <div class="form-control">
        <label class="theme-text-muted text-sm mb-2 block">Name</label>
        <input
          class="w-full rounded-md"
          style="background:var(--input-bg);border:1px solid var(--input-border);color:var(--text-primary);padding:.6rem .8rem;outline:none;box-shadow:none"
          [(ngModel)]="task.name"
          name="name"
          required
          placeholder="Enter task name"
          type="text"
        />
      </div>

      <!-- Task Todo -->
      <div class="form-control">
        <label class="theme-text-muted text-sm mb-2 block">Todo</label>
        <textarea
          class="w-full rounded-md"
          style="background:var(--input-bg);border:1px solid var(--input-border);color:var(--text-primary);padding:.6rem .8rem;outline:none;box-shadow:none;min-height:100px;"
          [(ngModel)]="task.todo"
          name="todo"
          placeholder="Enter task details..."
          rows="4"
        ></textarea>
      </div>

      <!-- Task Type -->
      <div class="form-control">
        <label class="theme-text-muted text-sm mb-2 block">Task Type</label>
        <select
          class="w-full rounded-md"
          style="background:var(--input-bg);border:1px solid var(--input-border);color:var(--text-primary);padding:.6rem .8rem;outline:none;box-shadow:none"
          [(ngModel)]="task.type"
          name="type"
          required
        >
          @for (taskType of taskTypes; track taskType) {
            <option [value]="taskType">
              {{ taskType }}
            </option>
          }
        </select>
      </div>

      <!-- Overlord Selection -->
      <div class="form-control">
        <label class="theme-text-muted text-sm mb-2 block">Target Overlord</label>
        <app-overlord-navigator></app-overlord-navigator>
      </div>

      <!-- Submit Button -->
      <div class="flex justify-end mt-6">
        <button class="theme-btn-primary w-10 h-10 rounded-lg flex items-center justify-center" type="submit">
          <mat-icon>save</mat-icon>
        </button>
      </div>
    </form>
  </div>
</div>
